name: Test Workflow

on:
    push:
        branches:
            - dev

jobs:
    build:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Run Command
              run: npm ci

            - name: Docker Build
              run: |
                docker build \
                -t node-app:latest \
                -t node-app:${{ github.sha }} \
                .

            - name: Print Docker Images
              run: docker images

            - name: Docker Authentication
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Tag Docker Image
              run: |
                docker tag node-app:latest ${{ secrets.DOCKER_USERNAME }}/user-management-system:latest
                docker tag node-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/user-management-system:${{ github.sha }}

            - name: Push Image to Dockerhub
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/user-management-system:latest
                docker push ${{ secrets.DOCKER_USERNAME }}/user-management-system:${{ github.sha }}
    
    deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:

        - name: Test SSH Connections
          run: |
            ssh -i ${{ secrets.EC2_PRIVATE_KEY }} ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}