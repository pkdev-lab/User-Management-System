name: Test Workflow

on:
    push:
        branches:
            - dev

jobs:
    node-app-ci:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Run Command
              run: npm ci

            - name: Docker Build
              run: |
                docker build \
                -t node-app:latest \
                -t node-app:${{ github.sha }} \
                .

            - name: Print Docker Images
              run: docker images

            - name: Docker Authentication
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Tag Docker Image
              run: |
                docker tag node-app:latest ${{ secrets.DOCKER_USERNAME }}/user-management-system:latest
                docker tag node-app:${{ github.sha }} ${{ secrets.Docker_USERNAME }}/user-management-system:${{ github.sha }}