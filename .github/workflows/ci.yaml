name: Test Workflow

on:
    push:
        branches:
            - dev

jobs:
    build:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Dependencies
              run: npm ci

            - name: Build Docker Image
              run: |
                docker build \
                -t node-app:latest \
                -t node-app:${{ github.sha }} \
                .

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Tag Docker Images
              run: |
                docker tag node-app:latest ${{ secrets.DOCKER_USERNAME }}/user-management-system:latest
                docker tag node-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/user-management-system:${{ github.sha }}

            - name: Push Docker Images
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/user-management-system:latest
                docker push ${{ secrets.DOCKER_USERNAME }}/user-management-system:${{ github.sha }}

    
    deploy:
      needs: build
      runs-on: ubuntu-latest

      steps:

        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.2
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_PRIVATE_KEY }}

            script: |
              cd /home/ubuntu/user-management-system
              docker compose pull
              docker compose up -d