services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123      

    volumes:
      - mongodb_data:/data/db

  node-app:
    build: .
    container_name: node-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/crud_app?authSource=admin

    depends_on:
      - mongodb

volumes:
    mongodb_data:

